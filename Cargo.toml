# DEFLATE, zlib, and gzip. Decompression refuses output past the caller cap
# (default 32 MiB). Also exports crc32 and adler32.
# Callers: root-image (PNG IDAT), root-video (frame packets), root-net
# (HTTP bodies), root-browser (profile snapshot and setup payload).

[package]
name = "root-compress"
version = "0.3.0"
edition = "2024"
authors = ["Buntos <324143321+buntatoes@users.noreply.github.com>"]
license = "MPL-2.0"
description = "DEFLATE, zlib, and gzip, with a cap on decompressed size."
repository = "https://github.com/buntatoes/root-compress"
homepage = "https://github.com/buntatoes/root-compress"
readme = "README.md"
keywords = ["deflate", "zlib", "gzip", "compression"]
categories = ["compression", "encoding"]
publish = false
