# DEFLATE, zlib, and gzip. Decompression refuses output past the caller cap
# (default 32 MiB). Also exports crc32 and adler32.
# Callers: anvil-image (PNG IDAT), anvil-video (frame packets), anvil-net
# (HTTP bodies), anvil-browser (profile snapshot and setup payload).

[package]
name = "anvil-compress"
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"
authors = ["Buntato <324143321+buntatoes@users.noreply.github.com>"]
license = "MPL-2.0"
description = "DEFLATE, zlib, and gzip, with a cap on decompressed size."
repository = "https://github.com/buntatoes/anvil-compress"
homepage = "https://github.com/buntatoes/anvil-compress"
readme = "README.md"
keywords = ["deflate", "zlib", "gzip", "compression"]
categories = ["compression", "encoding"]
publish = false
